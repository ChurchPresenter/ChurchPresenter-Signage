name: Release

# Push a tag like v0.1.0. Builds the agent with its own Java runtime for each platform, checks each
# bundle starts and serves its kiosk page, and publishes them with the install scripts and
# SHA256SUMS. The install commands in README.md download from the latest release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Version matches the tag
        run: |
          code=$(sed -n 's/^const val AGENT_VERSION = "\(.*\)"/\1/p' agent/src/main/kotlin/org/churchpresenter/signage/agent/Main.kt)
          test "v$code" = "$GITHUB_REF_NAME" || { echo "AGENT_VERSION $code does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Test and build
        run: ./gradlew :core:test :agent:test :agent:installDist --console=plain

      - name: Bundle with a Java runtime
        run: |
          out=churchpresenter-signage
          cp -r agent/build/install/churchpresenter-signage "$out"
          "$JAVA_HOME/bin/jlink" \
            --add-modules java.base,java.logging,java.management,java.naming,java.xml,jdk.crypto.ec,jdk.unsupported \
            --strip-debug --no-header-files --no-man-pages --compress zip-6 \
            --output "$out/runtime"

      - name: Bundle starts and serves its page
        run: |
          data=$(mktemp -d)
          if [ "${{ matrix.platform }}" = windows-x64 ]; then launcher=churchpresenter-signage/bin/churchpresenter-signage.bat; else launcher=churchpresenter-signage/bin/churchpresenter-signage; fi
          JAVA_HOME="$PWD/churchpresenter-signage/runtime" "$launcher" --data "$data" --no-cec --kiosk-port 18090 --address 127.0.0.1:1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18090/state && ok=1 && break; sleep 1; done
          kill %1 || true
          test "$ok" = 1

      - name: Archive
        run: |
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            7z a -tzip "churchpresenter-signage-${{ matrix.platform }}.zip" churchpresenter-signage
          else
            tar czf "churchpresenter-signage-${{ matrix.platform }}.tar.gz" churchpresenter-signage
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: churchpresenter-signage-${{ matrix.platform }}.*

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install/install.sh install/install.ps1 dist/
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
