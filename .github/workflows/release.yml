name: Release

# Push a tag like v0.1.0. Builds the agent with its own Java runtime for each platform, checks each
# bundle starts (on Linux, that it starts mpv and drives it), and publishes them with the install
# script, SHA256SUMS, and signage-release.json signed with the SIGNAGE_SIGNING_KEY secret, which is
# what ChurchPresenter and the players trust for updates. The install commands in README.md download
# from the latest release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Version matches the tag
        run: |
          code=$(sed -n 's/^const val AGENT_VERSION = "\(.*\)"/\1/p' agent/src/main/kotlin/org/churchpresenter/signage/agent/Main.kt)
          test "v$code" = "$GITHUB_REF_NAME" || { echo "AGENT_VERSION $code does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Test and build
        run: ./gradlew :core:test :agent:test :agent:installDist --console=plain

      - name: Bundle with a Java runtime
        run: |
          out=churchpresenter-signage
          cp -r agent/build/install/churchpresenter-signage "$out"
          echo "${GITHUB_REF_NAME#v}" > "$out/VERSION"
          cp install/launch.sh "$out/launch.sh"
          # java.desktop scales the Signage tab's previews (headless).
          "$JAVA_HOME/bin/jlink" \
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.xml,jdk.crypto.ec,jdk.unsupported \
            --strip-debug --no-header-files --no-man-pages --compress zip-6 \
            --output "$out/runtime"

      - name: Bundle starts and drives mpv
        run: |
          data=$(mktemp -d)
          log="$data/agent.log"
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            launcher=churchpresenter-signage/bin/churchpresenter-signage.bat
            # No mpv on the Windows runner: the agent must start and keep trying.
            ready="Signage agent"
          else
            launcher=churchpresenter-signage/bin/churchpresenter-signage
            sudo apt-get install -y -q --no-install-recommends mpv
            ready="mpv started"
          fi
          JAVA_HOME="$PWD/churchpresenter-signage/runtime" "$launcher" --data "$data" --no-cec \
            --address 127.0.0.1:1 --mpv-args "--vo=null" > "$log" 2>&1 &
          ok=0
          for i in $(seq 1 60); do grep -q "$ready" "$log" && ok=1 && break; sleep 1; done
          kill %1 || true
          cat "$log"
          test "$ok" = 1

      - name: Archive
        run: |
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            7z a -tzip "churchpresenter-signage-${{ matrix.platform }}.zip" churchpresenter-signage
          else
            tar czf "churchpresenter-signage-${{ matrix.platform }}.tar.gz" churchpresenter-signage
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: churchpresenter-signage-${{ matrix.platform }}.*

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write and sign the release index
        env:
          SIGNAGE_SIGNING_KEY: ${{ secrets.SIGNAGE_SIGNING_KEY }}
        run: |
          test -n "$SIGNAGE_SIGNING_KEY" || { echo "The SIGNAGE_SIGNING_KEY secret is not set"; exit 1; }
          protocol=$(sed -n 's/^const val PROTOCOL_VERSION = \([0-9]*\)$/\1/p' core/src/main/kotlin/org/churchpresenter/signage/core/Protocol.kt)
          python3 - "${GITHUB_REF_NAME#v}" "$protocol" <<'EOF'
          import hashlib, json, os, sys
          version, protocol = sys.argv[1], int(sys.argv[2])
          platforms = {"linux-arm64": "linux_arm64", "linux-x64": "linux_x64", "windows-x64": "windows_x64"}
          assets = {}
          for name in sorted(os.listdir("dist")):
              for key, platform in platforms.items():
                  if name.startswith(f"churchpresenter-signage-{key}."):
                      data = open(os.path.join("dist", name), "rb").read()
                      assets[platform] = {"name": name, "size": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          index = {"version": version, "protocolMin": protocol, "protocolMax": protocol, "assets": assets}
          open("dist/signage-release.json", "w").write(json.dumps(index, indent=2) + "\n")
          EOF
          key=$(mktemp)
          printf '%s\n' "$SIGNAGE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/signage-release.json -out signature.bin
          rm -f "$key"
          base64 -w0 signature.bin > dist/signage-release.json.sig
          cat dist/signage-release.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install/install.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
