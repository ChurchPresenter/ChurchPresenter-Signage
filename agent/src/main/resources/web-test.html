<!doctype html>
<html><head><meta charset="utf-8"><title>Checking this screen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; color: #eef2ff;
               font-family: "DejaVu Sans", "Segoe UI", sans-serif; }
  /* Three soft glows that drift over the whole screen, so every part of it changes each frame. */
  .glow { position: absolute; width: 56vmax; height: 56vmax; left: -28vmax; top: -28vmax; border-radius: 50%;
          will-change: transform; }
  .teal   { background: radial-gradient(closest-side, rgba(45, 212, 191, .42), rgba(45, 212, 191, 0)); }
  .violet { background: radial-gradient(closest-side, rgba(139, 92, 246, .45), rgba(139, 92, 246, 0)); }
  .amber  { background: radial-gradient(closest-side, rgba(251, 191, 36, .28), rgba(251, 191, 36, 0)); }
  main { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
         justify-content: center; text-align: center; }
  .brand { font-size: 2.2vh; letter-spacing: .5em; text-transform: uppercase; opacity: .7; margin-bottom: 3vh; }
  h1 { font-size: 9vh; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  p { font-size: 3vh; margin: 2.2vh 0 0; opacity: .78; font-weight: 400; }
  .bars { display: flex; gap: 1.4vh; align-items: flex-end; height: 9vh; margin-top: 7vh; }
  .bar { width: 1.4vh; height: 9vh; border-radius: 1vh; background: linear-gradient(#5eead4, #a78bfa);
         transform-origin: bottom; will-change: transform; }
  .line { position: absolute; left: 12vw; right: 12vw; bottom: 9vh; height: .4vh; border-radius: .4vh;
          background: rgba(238, 242, 255, .12); overflow: hidden; }
  .light { position: absolute; top: 0; bottom: 0; width: 22%; border-radius: .4vh; will-change: transform;
           background: linear-gradient(90deg, rgba(94, 234, 212, 0), #5eead4, #a78bfa, rgba(167, 139, 250, 0)); }
</style></head>
<body>
<div class="glow teal"></div>
<div class="glow violet"></div>
<div class="glow amber"></div>
<main>
  <div class="brand">ChurchPresenter</div>
  <h1>Checking this screen</h1>
  <p>How smoothly does it show web pages? This takes about a minute.</p>
  <div class="bars"></div>
</main>
<div class="line"><div class="light"></div></div>
<script>
  const w = () => innerWidth, h = () => innerHeight;
  const glows = [...document.querySelectorAll('.glow')].map((el, i) => ({ el, phase: i * 2.1, speed: .13 + i * .04 }));
  const bars = [];
  for (let i = 0; i < 11; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    document.querySelector('.bars').appendChild(b);
    bars.push(b);
  }
  const light = document.querySelector('.light');
  function frame(ms) {
    const t = ms / 1000;
    for (const g of glows) {
      const x = w() * (.5 + .38 * Math.sin(t * g.speed + g.phase));
      const y = h() * (.5 + .34 * Math.cos(t * g.speed * 1.3 + g.phase));
      g.el.style.transform = `translate(${x}px, ${y}px)`;
    }
    bars.forEach((b, i) => {
      const s = .25 + .75 * (.5 + .5 * Math.sin(t * 2.4 - i * .55));
      b.style.transform = `scaleY(${s})`;
    });
    light.style.transform = `translateX(${((t * .28) % 1.3 - .3) * 100 / .22}%)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body></html>
